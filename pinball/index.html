<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ピンボール</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    padding: 8px; background: #0b1020; color: #e8ecff; overflow: hidden;
    font-family: system-ui, "Hiragino Sans", "Yu Gothic UI", sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  #hud { display: flex; justify-content: space-between; width: min(100%, calc((100dvh - 92px) * 4 / 7)); font-variant-numeric: tabular-nums; }
  #hud b { font-size: 20px; display: block; }
  #hud small { color: #93a0d0; }
  canvas {
    width: min(100%, calc((100dvh - 92px) * 4 / 7)); aspect-ratio: 4 / 7;
    background: #131a33; border-radius: 12px; touch-action: none;
  }
  #help { margin: 0; font-size: 12px; color: #93a0d0; text-align: center; }
</style>
</head>
<body>
<div id="hud">
  <div><small>スコア</small><b id="score">0</b></div>
  <div><small>ボール</small><b id="balls">3</b></div>
  <div><small>倍率</small><b id="mult">×1</b></div>
  <div><small>ハイスコア</small><b id="best">0</b></div>
</div>
<canvas id="game" aria-label="ピンボール"></canvas>
<p id="help">PC: ← → でフリッパー、スペース長押しで発射 ／ スマホ: 画面の左右をタップ、長押しで発射</p>
<script>
const W = 400, H = 700;
const STEP = 1 / 240;
const GRAVITY = 520, MAX_SPEED = 1300;
const BALL_R = 9, FLIPPER_R = 6, FLIPPER_LEN = 58, FLIPPER_SPEED = 22;
const LANE_X = 372.5, LANE_Y = 650, LAUNCH_MIN = 350, LAUNCH_MAX = 1100;

const walls = [
  [10, 760, 10, 90], [10, 90, 90, 10], [90, 10, 300, 10], [300, 10, 390, 100],
  [390, 100, 390, 760], [355, 660, 390, 660], [355, 130, 355, 660],
  [10, 500, 112, 610], [355, 500, 253, 610],
];
const gate = [355, 130, 390, 100];
const bumpers = [
  { x: 125, y: 210, r: 24, flash: 0 },
  { x: 265, y: 210, r: 24, flash: 0 },
  { x: 195, y: 300, r: 24, flash: 0 },
];
const stars = [
  { x: 130, y: 110, lit: false },
  { x: 195, y: 90, lit: false },
  { x: 260, y: 110, lit: false },
];
const flippers = [
  { x: 112, y: 610, rest: 0.45, up: -0.5, angle: 0.45, omega: 0, active: false },
  { x: 253, y: 610, rest: Math.PI - 0.45, up: Math.PI + 0.5, angle: Math.PI - 0.45, omega: 0, active: false },
];

const ball = { x: LANE_X, y: LANE_Y, vx: 0, vy: 0 };
const game = { state: 'ready', charge: 0, charging: false, inLane: true, score: 0, balls: 3, mult: 1, best: 0 };

const ui = {
  score: document.getElementById('score'),
  balls: document.getElementById('balls'),
  mult: document.getElementById('mult'),
  best: document.getElementById('best'),
};

function loadBest() {
  try { game.best = Number(localStorage.getItem('pinball-best')) || 0; } catch (e) {}
}

function saveBest() {
  try { localStorage.setItem('pinball-best', String(game.best)); } catch (e) {}
}

function updateHud() {
  ui.score.textContent = game.score.toLocaleString();
  ui.balls.textContent = game.balls;
  ui.mult.textContent = '×' + game.mult;
  ui.best.textContent = game.best.toLocaleString();
}

function addScore(points) {
  game.score += points * game.mult;
  if (game.score > game.best) { game.best = game.score; saveBest(); }
  updateHud();
}

function resetBall() {
  Object.assign(ball, { x: LANE_X, y: LANE_Y, vx: 0, vy: 0 });
  game.inLane = true;
  game.charge = 0;
  game.state = 'ready';
}

function newGame() {
  Object.assign(game, { score: 0, balls: 3, mult: 1 });
  stars.forEach(s => { s.lit = false; });
  resetBall();
  updateHud();
}

function loseBall() {
  game.balls -= 1;
  game.mult = 1;
  updateHud();
  if (game.balls > 0) resetBall();
  else game.state = 'over';
}

function startCharge() {
  if (game.state === 'ready') game.charging = true;
}

function endCharge() {
  if (game.state === 'over') { newGame(); return; }
  if (game.charging && game.state === 'ready') {
    ball.vy = -(LAUNCH_MIN + (LAUNCH_MAX - LAUNCH_MIN) * game.charge);
    game.state = 'play';
  }
  game.charging = false;
  game.charge = 0;
}

// Pushes the ball out of a capsule; (surfaceVx, surfaceVy) lets flippers hit it.
function collide(ax, ay, bx, by, radius, restitution, omega, px, py) {
  const dx = bx - ax, dy = by - ay;
  const t = Math.max(0, Math.min(1, ((ball.x - ax) * dx + (ball.y - ay) * dy) / (dx * dx + dy * dy)));
  const cx = ax + dx * t, cy = ay + dy * t;
  const ox = ball.x - cx, oy = ball.y - cy;
  const dist = Math.hypot(ox, oy);
  if (dist === 0 || dist >= radius) return;
  const nx = ox / dist, ny = oy / dist;
  ball.x = cx + nx * radius;
  ball.y = cy + ny * radius;
  const surfaceVx = omega ? -omega * (cy - py) : 0;
  const surfaceVy = omega ? omega * (cx - px) : 0;
  const approach = (ball.vx - surfaceVx) * nx + (ball.vy - surfaceVy) * ny;
  if (approach < 0) {
    ball.vx -= (1 + restitution) * approach * nx;
    ball.vy -= (1 + restitution) * approach * ny;
  }
}

function moveFlipper(f) {
  const target = f.active ? f.up : f.rest;
  const previous = f.angle;
  const delta = target - f.angle;
  const reach = FLIPPER_SPEED * STEP;
  f.angle += Math.abs(delta) < reach ? delta : Math.sign(delta) * reach;
  f.omega = (f.angle - previous) / STEP;
}

function hitBumpers() {
  for (const b of bumpers) {
    const ox = ball.x - b.x, oy = ball.y - b.y;
    const dist = Math.hypot(ox, oy), reach = b.r + BALL_R;
    if (dist === 0 || dist >= reach) continue;
    const nx = ox / dist, ny = oy / dist;
    ball.x = b.x + nx * reach;
    ball.y = b.y + ny * reach;
    const approach = ball.vx * nx + ball.vy * ny;
    ball.vx += (260 - Math.min(approach, 0)) * nx;
    ball.vy += (260 - Math.min(approach, 0)) * ny;
    b.flash = 0.12;
    addScore(100);
  }
}

function hitStars() {
  for (const s of stars) {
    if (!s.lit && Math.hypot(ball.x - s.x, ball.y - s.y) < BALL_R + 10) {
      s.lit = true;
      addScore(250);
    }
  }
  if (stars.every(s => s.lit)) {
    stars.forEach(s => { s.lit = false; });
    game.mult = Math.min(game.mult + 1, 5);
    addScore(1000);
  }
}

function step() {
  flippers.forEach(moveFlipper);
  bumpers.forEach(b => { b.flash = Math.max(0, b.flash - STEP); });
  if (game.charging) game.charge = Math.min(1, game.charge + STEP / 1.2);
  if (game.state !== 'play') return;

  ball.vy += GRAVITY * STEP;
  const speed = Math.hypot(ball.vx, ball.vy);
  if (speed > MAX_SPEED) {
    ball.vx *= MAX_SPEED / speed;
    ball.vy *= MAX_SPEED / speed;
  }
  ball.x += ball.vx * STEP;
  ball.y += ball.vy * STEP;

  for (const f of flippers) {
    const tipX = f.x + Math.cos(f.angle) * FLIPPER_LEN;
    const tipY = f.y + Math.sin(f.angle) * FLIPPER_LEN;
    collide(f.x, f.y, tipX, tipY, BALL_R + FLIPPER_R, 0.3, f.omega, f.x, f.y);
  }
  // Walls run after flippers so a raised flipper cannot squeeze the ball through a slope.
  for (const w of walls) collide(w[0], w[1], w[2], w[3], BALL_R, 0.45, 0, 0, 0);
  if (game.inLane && ball.x < 345) game.inLane = false;
  if (!game.inLane) collide(gate[0], gate[1], gate[2], gate[3], BALL_R, 0.45, 0, 0, 0);
  hitBumpers();
  hitStars();

  if (game.inLane && ball.y >= LANE_Y && ball.vy >= 0) resetBall();
  if (ball.y > H + 30) loseBall();
}

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function resize() {
  const ratio = window.devicePixelRatio || 1;
  canvas.width = canvas.clientWidth * ratio;
  canvas.height = canvas.clientHeight * ratio;
}

function line(x1, y1, x2, y2, color, width) {
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
}

function circle(x, y, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
}

function draw() {
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  ctx.clearRect(0, 0, W, H);

  for (const w of walls) line(w[0], w[1], w[2], w[3], '#5b6bb5', 4);
  if (!game.inLane) line(gate[0], gate[1], gate[2], gate[3], '#5b6bb5', 4);
  for (const s of stars) circle(s.x, s.y, 8, s.lit ? '#ffd65a' : '#39436f');
  for (const b of bumpers) {
    circle(b.x, b.y, b.r, b.flash > 0 ? '#ffd65a' : '#ff6b8a');
    circle(b.x, b.y, b.r * 0.55, '#131a33');
  }
  for (const f of flippers) {
    line(f.x, f.y, f.x + Math.cos(f.angle) * FLIPPER_LEN, f.y + Math.sin(f.angle) * FLIPPER_LEN, '#62e0c8', FLIPPER_R * 2);
  }
  if (game.state === 'ready') line(LANE_X, 690, LANE_X, 672 + game.charge * 16, '#62e0c8', 8);
  circle(ball.x, ball.y, BALL_R, '#f2f4ff');

  ctx.textAlign = 'center';
  ctx.fillStyle = '#e8ecff';
  if (game.state === 'ready' && !game.charging) {
    ctx.font = '16px system-ui, sans-serif';
    ctx.fillText('長押しで発射', 182, 420);
  }
  if (game.state === 'over') {
    ctx.font = 'bold 32px system-ui, sans-serif';
    ctx.fillText('ゲームオーバー', 182, 390);
    ctx.font = '16px system-ui, sans-serif';
    ctx.fillText('タップまたはスペースでもう一度', 182, 422);
  }
}

const pointers = new Map();

function syncPointers() {
  flippers[0].active = keys.left || [...pointers.values()].includes(0);
  flippers[1].active = keys.right || [...pointers.values()].includes(1);
}

const keys = { left: false, right: false };
const keyMap = { ArrowLeft: 'left', z: 'left', Z: 'left', ArrowRight: 'right', '/': 'right' };

window.addEventListener('keydown', e => {
  if (keyMap[e.key]) { keys[keyMap[e.key]] = true; syncPointers(); e.preventDefault(); }
  if ((e.key === ' ' || e.key === 'ArrowDown') && !e.repeat) { startCharge(); }
  if (e.key === ' ' || e.key === 'ArrowDown') e.preventDefault();
});

window.addEventListener('keyup', e => {
  if (keyMap[e.key]) { keys[keyMap[e.key]] = false; syncPointers(); }
  if (e.key === ' ' || e.key === 'ArrowDown') endCharge();
});

canvas.addEventListener('pointerdown', e => {
  const box = canvas.getBoundingClientRect();
  pointers.set(e.pointerId, e.clientX - box.left < box.width / 2 ? 0 : 1);
  canvas.setPointerCapture(e.pointerId);
  syncPointers();
  startCharge();
});

function releasePointer(e) {
  if (!pointers.delete(e.pointerId)) return;
  syncPointers();
  if (pointers.size === 0) endCharge();
}

canvas.addEventListener('pointerup', releasePointer);
canvas.addEventListener('pointercancel', releasePointer);
window.addEventListener('resize', resize);

let last = 0, pending = 0;

function frame(time) {
  pending += Math.min((time - last) / 1000 || 0, 0.05);
  last = time;
  while (pending >= STEP) { step(); pending -= STEP; }
  draw();
  requestAnimationFrame(frame);
}

loadBest();
updateHud();
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
